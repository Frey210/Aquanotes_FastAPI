services:
  api:
    build:
      context: ../..
      dockerfile: deployment/stage2/Dockerfile
    restart: unless-stopped
    env_file:
      - ./secrets/app.env
    volumes:
      - ./secrets/firebase-admin.json:/app/app/firebase/aqua-notes-firebase-adminsdk-fbsvc-6de08d39b2.json:ro
    ports:
      - "192.168.10.64:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    image: ${WEB_IMAGE:-aquanotes-web:20260905-users}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "192.168.10.64:8080:80"
