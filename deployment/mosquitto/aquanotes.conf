autosave_interval 60

allow_anonymous false
password_file /etc/mosquitto/aquanotes/passwords
acl_file /etc/mosquitto/aquanotes/acl

max_packet_size 32768
max_keepalive 300
message_size_limit 16384

listener 1883 192.168.10.66
protocol mqtt

listener 8883 192.168.10.66
protocol mqtt
cafile /etc/mosquitto/aquanotes/certs/ca.crt
certfile /etc/mosquitto/aquanotes/certs/server.crt
keyfile /etc/mosquitto/aquanotes/certs/server.key
tls_version tlsv1.2

listener 8083 192.168.10.66
protocol websockets

log_dest syslog
log_type error
log_type warning
log_type notice
connection_messages true
